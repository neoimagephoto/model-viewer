<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-950 text-slate-100 font-sans antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D AR Studio</title>
    
    <!-- iPhone Web App & PWA 圖示與設定 -->
    <link rel="apple-touch-icon" sizes="180x180" href="AR(180x180).png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="3D AR Studio">

    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass-panel {
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .fade-out {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-out;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }
        select option {
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>
<body class="h-full overflow-hidden flex flex-col justify-between relative bg-gradient-to-b from-slate-900 via-slate-950 to-black select-none">

    <!-- 頂部列 Header -->
    <header class="absolute top-0 left-0 right-0 z-40 p-3 sm:p-4 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
        <div class="flex items-center space-x-2 pointer-events-auto">
            <div class="glass-panel px-3 py-1.5 rounded-full flex items-center space-x-2 text-xs font-medium text-slate-200">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="status-badge">攝影棚模式</span>
            </div>

            <!-- 模型選單切換器 Model Selector -->
            <div class="glass-panel rounded-full px-2 py-1 flex items-center space-x-1 text-xs text-slate-200">
                <i class="fa-solid fa-cubes text-indigo-400 ml-1"></i>
                <select id="model-select" class="bg-transparent border-none text-xs font-medium focus:outline-none text-white cursor-pointer pr-1">
                    <option value="https://modelviewer.dev/shared-assets/models/Astronaut.glb" selected>👨‍🚀 太空人 (預設)</option>
                    <option value="https://modelviewer.dev/shared-assets/models/glTF-Sample-Assets/Models/DamagedHelmet/glTF-Binary/DamagedHelmet.glb">🪖 復古科幻頭盔</option>
                    <option value="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb">🤖 機器人</option>
                    <option value="https://neoimagephot.github.io/model-viewer/Giraffe-002.glb">🦒 長頸鹿</option>
                </select>
            </div>
        </div>

        <div class="flex items-center space-x-2 pointer-events-auto">
            <!-- 檔案上傳按鈕 -->
            <label class="glass-panel px-3 py-2 rounded-xl text-xs font-medium text-white hover:bg-white/20 active:scale-95 transition cursor-pointer flex items-center space-x-1.5">
                <i class="fa-solid fa-file-arrow-up text-blue-400"></i>
                <span class="hidden sm:inline">匯入 GLB 模型</span>
                <span class="sm:hidden">匯入</span>
                <input type="file" id="glb-file-input" accept=".glb,.gltf" class="hidden">
            </label>
            <!-- 資訊面板切換按鈕 -->
            <button id="toggle-info-btn" class="glass-panel w-9 h-9 rounded-xl flex items-center justify-center text-slate-300 hover:text-white hover:bg-white/20 active:scale-95 transition">
                <i class="fa-solid fa-circle-info text-sm"></i>
            </button>
        </div>
    </header>

    <!-- 主 3D 視窗與拖曳上傳區域 -->
    <main id="drop-zone" class="relative w-full h-full flex-1 flex items-center justify-center overflow-hidden">
        
        <!-- 拖曳檔案覆蓋提示 Overlay -->
        <div id="drag-overlay" class="absolute inset-0 z-30 bg-blue-600/30 backdrop-blur-sm border-4 border-dashed border-blue-400 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
            <i class="fa-solid fa-cloud-arrow-up text-5xl text-white mb-3 animate-bounce"></i>
            <p class="text-lg font-bold text-white">放開滑鼠以載入 3D GLB 模型</p>
            <p class="text-xs text-blue-200 mt-1">支援 .glb 與 .gltf 格式</p>
        </div>

        <!-- Google <model-viewer> 3D 模型元件 -->
        <model-viewer
            id="3d-viewer"
            src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
            alt="3D AR Model Studio"
            ar
            ar-modes="webxr scene-viewer quick-look"
            camera-controls
            auto-rotate
            shadow-intensity="1.5"
            shadow-softness="0.8"
            exposure="1.1"
            environment-image="spruit_sunrise_1k_hdr.hdr"
            interaction-prompt="auto">
            
            <button slot="ar-button" id="custom-ar-btn" class="hidden"></button>
        </model-viewer>

        <!-- 右側 Inspector 資訊彈窗 -->
        <aside id="info-panel" class="absolute top-16 right-4 z-40 w-80 glass-panel rounded-2xl p-4 shadow-2xl transition-all duration-300 transform translate-x-96 opacity-0 pointer-events-none">
            <div class="flex items-center justify-between border-b border-white/10 pb-2 mb-3">
                <h3 class="text-sm font-semibold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-microchip text-indigo-400"></i>
                    <span>glTF 模型詳細資訊</span>
                </h3>
                <button id="close-info-btn" class="text-slate-400 hover:text-white text-xs">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <div class="space-y-2.5 text-xs">
                <div class="flex justify-between py-1 border-b border-white/5">
                    <span class="text-slate-400">當前模型 (Model):</span>
                    <span id="model-name-text" class="font-mono text-blue-400 truncate max-w-[140px]">Astronaut.glb</span>
                </div>
                <div class="flex justify-between py-1 border-b border-white/5">
                    <span class="text-slate-400">產生器 (Generator):</span>
                    <span id="meta-generator" class="font-mono text-slate-200 truncate max-w-[140px]" title="Khronos glTF">Khronos glTF</span>
                </div>
                <div class="flex justify-between py-1 border-b border-white/5">
                    <span class="text-slate-400">網格名稱 (Node):</span>
                    <span id="meta-node" class="font-mono text-amber-400 font-semibold">Mesh</span>
                </div>

                <!-- 材質即時微調 Slider Controls -->
                <div class="pt-2">
                    <p class="text-slate-300 font-medium mb-2 flex items-center space-x-1">
                        <i class="fa-solid fa-palette text-amber-400"></i>
                        <span>材質即時調整</span>
                    </p>
                    <div class="space-y-2 bg-black/30 p-2.5 rounded-xl border border-white/5">
                        <div>
                            <div class="flex justify-between text-[11px] text-slate-400 mb-1">
                                <span>基礎顏色 (Base Color)</span>
                                <input type="color" id="mat-color" value="#ffffff" class="w-5 h-5 rounded cursor-pointer border-none bg-transparent">
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-[11px] text-slate-400 mb-1">
                                <span>粗糙度 (Roughness)</span>
                                <span id="roughness-val" class="font-mono text-slate-200">0.5</span>
                            </div>
                            <input type="range" id="mat-roughness" min="0" max="1" step="0.05" value="0.5" class="w-full accent-blue-500">
                        </div>
                        <div>
                            <div class="flex justify-between text-[11px] text-slate-400 mb-1">
                                <span>金屬感 (Metallic)</span>
                                <span id="metallic-val" class="font-mono text-slate-200">0.0</span>
                            </div>
                            <input type="range" id="mat-metallic" min="0" max="1" step="0.05" value="0" class="w-full accent-blue-500">
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Loading 載入進度畫面 -->
        <div id="loading-overlay" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-black/85 backdrop-blur-md transition-opacity duration-500">
            <div class="flex flex-col items-center max-w-xs w-full px-6 text-center">
                <div class="w-12 h-12 mb-5 relative">
                    <div class="w-12 h-12 rounded-full border-2 border-white/10 border-t-blue-500 animate-spin"></div>
                </div>
                <h2 class="text-lg font-medium text-white mb-1">載入 3D 攝影棚</h2>
                <p id="loading-text" class="text-xs text-white/50 mb-4">正在渲染 3D 幾何結構...</p>
                <div class="w-full bg-white/10 h-1.5 rounded-full overflow-hidden backdrop-blur-sm">
                    <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-indigo-400 h-full w-0 transition-all duration-200 ease-out rounded-full"></div>
                </div>
                <span id="progress-percent" class="text-[10px] text-white/40 mt-2 font-mono">0%</span>
            </div>
        </div>
    </main>

    <!-- 底部懸浮控制列 -->
    <footer class="absolute bottom-6 left-0 right-0 z-40 flex justify-center px-4 pointer-events-none">
        <div class="glass-panel px-4 py-3 rounded-2xl flex items-center space-x-3 pointer-events-auto shadow-2xl max-w-md w-full justify-around">
            <!-- 自動旋轉開關 -->
            <button id="toggle-rotate-btn" class="flex flex-col items-center space-y-1 text-slate-300 hover:text-white transition group">
                <div class="w-9 h-9 rounded-xl bg-white/5 group-hover:bg-white/15 flex items-center justify-center transition">
                    <i id="rotate-icon" class="fa-solid fa-arrows-spin text-blue-400"></i>
                </div>
                <span id="rotate-btn-text" class="text-[10px] font-medium">旋轉: 開</span>
            </button>

            <!-- 重設視角 -->
            <button id="reset-view-btn" class="flex flex-col items-center space-y-1 text-slate-300 hover:text-white transition group">
                <div class="w-9 h-9 rounded-xl bg-white/5 group-hover:bg-white/15 flex items-center justify-center transition">
                    <i class="fa-solid fa-compress text-indigo-400"></i>
                </div>
                <span class="text-[10px] font-medium">重設視角</span>
            </button>

            <!-- 燈光模式切換 -->
            <button id="toggle-env-btn" class="flex flex-col items-center space-y-1 text-slate-300 hover:text-white transition group">
                <div class="w-9 h-9 rounded-xl bg-white/5 group-hover:bg-white/15 flex items-center justify-center transition">
                    <i class="fa-solid fa-sun text-amber-400"></i>
                </div>
                <span class="text-[10px] font-medium">切換燈光</span>
            </button>

            <!-- AR 擴增實境按鈕 -->
            <button id="trigger-ar-btn" class="flex flex-col items-center space-y-1 text-white transition group">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-r from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/30 group-hover:scale-105 transition">
                    <i class="fa-solid fa-cube text-white"></i>
                </div>
                <span class="text-[10px] font-medium text-blue-300">AR 實境</span>
            </button>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modelViewer = document.getElementById('3d-viewer');
            const loadingOverlay = document.getElementById('loading-overlay');
            const progressBar = document.getElementById('progress-bar');
            const progressPercent = document.getElementById('progress-percent');
            const loadingText = document.getElementById('loading-text');
            const toggleRotateBtn = document.getElementById('toggle-rotate-btn');
            const rotateIcon = document.getElementById('rotate-icon');
            const rotateBtnText = document.getElementById('rotate-btn-text');
            const resetViewBtn = document.getElementById('reset-view-btn');
            const triggerArBtn = document.getElementById('trigger-ar-btn');
            const customArBtn = document.getElementById('custom-ar-btn');
            const statusBadge = document.getElementById('status-badge');
            const dropZone = document.getElementById('drop-zone');
            const dragOverlay = document.getElementById('drag-overlay');
            const glbFileInput = document.getElementById('glb-file-input');
            const infoPanel = document.getElementById('info-panel');
            const toggleInfoBtn = document.getElementById('toggle-info-btn');
            const closeInfoBtn = document.getElementById('close-info-btn');
            const modelNameText = document.getElementById('model-name-text');
            const toggleEnvBtn = document.getElementById('toggle-env-btn');
            const modelSelect = document.getElementById('model-select');

            /* 依指示設定指定的 HDR 環境照明檔案 */
            modelViewer.setAttribute('environment-image', 'spruit_sunrise_1k_hdr.hdr');

            /* Material controls */
            const matColor = document.getElementById('mat-color');
            const matRoughness = document.getElementById('mat-roughness');
            const matMetallic = document.getElementById('mat-metallic');
            const roughnessVal = document.getElementById('roughness-val');
            const metallicVal = document.getElementById('metallic-val');

            let isAutoRotateEnabled = true;
            let currentEnvIndex = 0;
            const envPresets = ['spruit_sunrise_1k_hdr.hdr', 'neutral', 'legacy'];

            /* 1. 載入進度條與錯誤處理 */
            modelViewer.addEventListener('progress', (event) => {
                const progress = event.detail.totalProgress;
                const percent = Math.round(progress * 100);
                progressBar.style.width = `${percent}%`;
                progressPercent.textContent = `${percent}%`;

                if (progress === 1) {
                    setTimeout(() => {
                        loadingOverlay.classList.add('fade-out');
                        setTimeout(() => {
                            loadingOverlay.style.display = 'none';
                        }, 500);
                    }, 200);
                }
            });

            modelViewer.addEventListener('error', (event) => {
                console.warn("模型載入受阻，可切換選單中的其他模型...", event);
                loadingText.textContent = "請選擇其他 3D 模型...";
            });

            /* 2. 切換選單模型 (Model Switching) */
            modelSelect.addEventListener('change', (e) => {
                const selectedSrc = e.target.value;
                const selectedText = e.target.options[e.target.selectedIndex].text;
                switchModelSource(selectedSrc, selectedText);
            });

            function switchModelSource(srcUrl, displayName) {
                loadingOverlay.style.display = 'flex';
                loadingOverlay.classList.remove('fade-out');
                loadingText.textContent = `載入 ${displayName || '模型'}...`;
                modelViewer.src = srcUrl;
                modelNameText.textContent = displayName || srcUrl.split('/').pop();
            }

            /* 3. GLB 檔案匯入與動態加入選單 (Import & Dynamic Option) */
            function loadGlbFile(file) {
                if (!file || (!file.name.endsWith('.glb') && !file.name.endsWith('.gltf'))) {
                    showNotification('請選擇有效的 .glb 或 .gltf 3D 模型檔案');
                    return;
                }

                const blobUrl = URL.createObjectURL(file);
                const optionText = `📁 ${file.name}`;

                // 新增至選單並選取
                const newOption = document.createElement('option');
                newOption.value = blobUrl;
                newOption.textContent = optionText;
                newOption.selected = true;
                modelSelect.appendChild(newOption);

                switchModelSource(blobUrl, file.name);

                // 解析 glTF metadata
                parseGltfMetadata(file);
            }

            glbFileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    loadGlbFile(e.target.files[0]);
                }
            });

            // 拖曳上傳支援
            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    dragOverlay.classList.remove('opacity-0', 'pointer-events-none');
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    dragOverlay.classList.add('opacity-0', 'pointer-events-none');
                }, false);
            });

            dropZone.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                const files = dt.files;
                if (files.length > 0) {
                    loadGlbFile(files[0]);
                }
            });

            /* 4. 解析 GLB JSON Metadata */
            function parseGltfMetadata(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const buffer = e.target.result;
                        const dataView = new DataView(buffer);
                        const magic = dataView.getUint32(0, true);
                        if (magic === 0x46546C67) { // 'glTF'
                            const jsonChunkLength = dataView.getUint32(12, true);
                            const jsonChunkType = dataView.getUint32(16, true);
                            if (jsonChunkType === 0x4E4F534A) { // 'JSON'
                                const jsonText = new TextDecoder('utf-8').decode(new Uint8Array(buffer, 20, jsonChunkLength));
                                const gltfJson = JSON.parse(jsonText);
                                updateInfoPanelUI(gltfJson);
                            }
                        }
                    } catch (err) {
                        console.log("解析 GLB 標頭資訊中...", err);
                    }
                };
                reader.readAsArrayBuffer(file);
            }

            function updateInfoPanelUI(gltf) {
                if (gltf.asset && gltf.asset.generator) {
                    document.getElementById('meta-generator').textContent = gltf.asset.generator;
                }
                if (gltf.nodes && gltf.nodes[0] && gltf.nodes[0].name) {
                    document.getElementById('meta-node').textContent = gltf.nodes[0].name;
                }
                if (gltf.materials && gltf.materials[0]) {
                    const mat = gltf.materials[0];
                    if (mat.pbrMetallicRoughness) {
                        const pbr = mat.pbrMetallicRoughness;
                        if (pbr.roughnessFactor !== undefined) {
                            matRoughness.value = pbr.roughnessFactor;
                            roughnessVal.textContent = pbr.roughnessFactor;
                        }
                        if (pbr.metallicFactor !== undefined) {
                            matMetallic.value = pbr.metallicFactor;
                            metallicVal.textContent = pbr.metallicFactor;
                        }
                    }
                }
            }

            /* 5. 自動旋轉與燈光模式控制 */
            function updateRotateUI(enabled) {
                if (enabled) {
                    modelViewer.autoRotate = true;
                    rotateBtnText.textContent = '旋轉: 開';
                    rotateIcon.classList.add('animate-spin');
                    rotateIcon.style.animationDuration = '10s';
                } else {
                    modelViewer.autoRotate = false;
                    rotateBtnText.textContent = '旋轉: 關';
                    rotateIcon.classList.remove('animate-spin');
                }
            }

            toggleRotateBtn.addEventListener('click', () => {
                isAutoRotateEnabled = !isAutoRotateEnabled;
                updateRotateUI(isAutoRotateEnabled);
            });

            toggleEnvBtn.addEventListener('click', () => {
                currentEnvIndex = (currentEnvIndex + 1) % envPresets.length;
                modelViewer.setAttribute('environment-image', envPresets[currentEnvIndex]);
                showNotification(`切換燈光: ${envPresets[currentEnvIndex]}`);
            });

            resetViewBtn.addEventListener('click', () => {
                modelViewer.cameraOrbit = '0deg 75deg 105%';
                modelViewer.cameraTarget = 'auto auto auto';
                modelViewer.fieldOfView = 'auto';
            });

            /* 6. AR 啟動與資訊面板開關 */
            triggerArBtn.addEventListener('click', () => {
                if (modelViewer.canActivateAR) {
                    modelViewer.activateAR();
                } else {
                    customArBtn.click();
                }
            });

            let isInfoOpen = false;
            function toggleInfoPanel() {
                isInfoOpen = !isInfoOpen;
                if (isInfoOpen) {
                    infoPanel.classList.remove('translate-x-96', 'opacity-0', 'pointer-events-none');
                } else {
                    infoPanel.classList.add('translate-x-96', 'opacity-0', 'pointer-events-none');
                }
            }

            toggleInfoBtn.addEventListener('click', toggleInfoPanel);
            closeInfoBtn.addEventListener('click', toggleInfoPanel);

            /* 7. 即時材質動態調色板 */
            modelViewer.addEventListener('load', () => {
                statusBadge.textContent = '3D 攝影棚 Ready';
                const material = modelViewer.model && modelViewer.model.materials[0];
                if (!material) return;

                matColor.addEventListener('input', (e) => {
                    const hex = e.target.value;
                    const r = parseInt(hex.slice(1, 3), 16) / 255;
                    const g = parseInt(hex.slice(3, 5), 16) / 255;
                    const b = parseInt(hex.slice(5, 7), 16) / 255;
                    material.pbrMetallicRoughness.setBaseColorFactor([r, g, b, 1.0]);
                });

                matRoughness.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    roughnessVal.textContent = val;
                    material.pbrMetallicRoughness.setRoughnessFactor(val);
                });

                matMetallic.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    metallicVal.textContent = val;
                    material.pbrMetallicRoughness.setMetallicFactor(val);
                });
            });

            function showNotification(text) {
                statusBadge.textContent = text;
                setTimeout(() => {
                    statusBadge.textContent = '3D 攝影棚 Ready';
                }, 2500);
            }

            updateRotateUI(true);
        });
    </script>
</body>
</html>
